# Los valores sensibles se inyectan por interpolacion; este archivo no contiene secretos.
# Uso:  docker compose --env-file deploy/.env.lan -f docker-compose.lan.yml up -d --build
# Plantilla:  .env.lan.example
services:
  postgres:
    image: postgres:18
    container_name: saas_integral_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: saas_integral_gestion_operativa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en deploy/.env.lan}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_integral_gestion_operativa"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: saas_integral_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_integral_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en deploy/.env.lan}@postgres:5432/saas_integral_gestion_operativa?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?define JWT_ACCESS_SECRET en deploy/.env.lan (openssl rand -hex 32)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?define JWT_REFRESH_SECRET en deploy/.env.lan (openssl rand -hex 32)}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      AUTH_COOKIE_SECURE: "false"
      MESSAGE_BUS_DRIVER: bullmq
      MESSAGING_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      QUEUE_CONCURRENCY_AUTOMATION_EVENTS: "3"
      QUEUE_CONCURRENCY_WORKFLOW_EVENTS: "3"
      QUEUE_CONCURRENCY_NOTIFICATIONS: "2"
      QUEUE_CONCURRENCY_DOCUMENTS: "2"
      QUEUE_CONCURRENCY_TRAINING: "2"
      SCORM_STORAGE_ROOT: /app/storage/scorm
      SCORM_STORAGE_DRIVER: filesystem
      SCORM_ANTIVIRUS_MODE: disabled
      SCORM_ALLOW_UNSCANNED_UPLOADS: "true"
      SCORM_MAX_UPLOAD_BYTES: "104857600"
      SCORM_TENANT_QUOTA_BYTES: "2147483648"
      SCORM_TENANT_PACKAGE_LIMIT: "250"
      SCORM_SIGNING_KEY: ${SCORM_SIGNING_KEY:?define SCORM_SIGNING_KEY en deploy/.env.lan (openssl rand -hex 32)}
      DOCUMENT_STORAGE_ROOT: /app/storage/documents
      DOCUMENT_STORAGE_DRIVER: local
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?define WEBHOOK_ENCRYPTION_KEY en deploy/.env.lan (openssl rand -hex 32)}
      SUPERADMIN_EMAIL: superadmin@saasintegral.com
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?define SUPERADMIN_PASSWORD en deploy/.env.lan}
      SUPERADMIN_TENANT_SLUG: platform
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:3000,http://10.0.0.120,http://10.0.0.120:3000
      PUBLIC_FRONTEND_URL: http://10.0.0.120
    ports:
      - "0.0.0.0:3002:3000"
    volumes:
      - scorm_storage:/app/storage/scorm
      - document_storage:/app/storage/documents

  frontend:
    build:
      context: ../FrontEnd/frontend-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: saas_integral_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      INTERNAL_API_URL: http://backend:3000/api
      SESSION_COOKIE_SECURE: "false"
    expose:
      - "3001"

  gateway:
    image: nginx:1.27-alpine
    container_name: saas_integral_gateway
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.lan.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
  scorm_storage:
  document_storage:
