services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in the Portainer stack environment}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER in the Portainer stack environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the Portainer stack environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saas-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD in the Portainer stack environment}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Define REDIS_PASSWORD in the Portainer stack environment}
    volumes:
      - redis_data:/data
    networks:
      - saas-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/paulgarcia89/saas-integral-backend}:${BACKEND_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET in the Portainer stack environment}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET in the Portainer stack environment}
      CANDIDATE_JWT_SECRET: ${CANDIDATE_JWT_SECRET:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS in the Portainer stack environment}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:?Define PUBLIC_FRONTEND_URL in the Portainer stack environment}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-RESEND}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:?Define NOTIFICATION_FROM_EMAIL in the Portainer stack environment}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_FAMILY: ${SMTP_FAMILY:-4}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_DELIVERY_WORKER_ENABLED: ${NOTIFICATION_DELIVERY_WORKER_ENABLED:-true}
      NOTIFICATION_DELIVERY_POLL_MS: ${NOTIFICATION_DELIVERY_POLL_MS:-30000}
      SCORM_STORAGE_ROOT: /app/storage/scorm
      DOCUMENT_STORAGE_ROOT: /app/storage/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - scorm_storage:/app/storage/scorm
      - document_storage:/app/storage/documents
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - saas-internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/paulgarcia89/saas-integral-frontend}:${FRONTEND_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      INTERNAL_API_URL: http://backend:3000/api
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    networks:
      - saas-internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  saas-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  scorm_storage:
  document_storage:
