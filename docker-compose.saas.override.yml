# Se combina con el docker-compose.yml principal del servidor.
# Las redes proxy-net y saas-internal las declara el Compose principal.
services:
  saas-postgres:
    image: postgres:16-alpine
    container_name: saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SAAS_POSTGRES_DB:-saas_integral_gestion_operativa}
      POSTGRES_USER: ${SAAS_POSTGRES_USER:-saas_app}
      POSTGRES_PASSWORD: ${SAAS_POSTGRES_PASSWORD:?Define SAAS_POSTGRES_PASSWORD}
    volumes:
      - saas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${SAAS_POSTGRES_USER:-saas_app} -d $${SAAS_POSTGRES_DB:-saas_integral_gestion_operativa}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - saas-internal

  saas-redis:
    image: redis:7.4-alpine
    container_name: saas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${SAAS_REDIS_PASSWORD:?Define SAAS_REDIS_PASSWORD}"]
    volumes:
      - saas_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${SAAS_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - saas-internal

  saas-backend:
    image: ghcr.io/paulgarcia89/saas-integral-backend:latest
    container_name: saas-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${SAAS_POSTGRES_USER:-saas_app}:${SAAS_POSTGRES_PASSWORD}@saas-postgres:5432/${SAAS_POSTGRES_DB:-saas_integral_gestion_operativa}?schema=public
      REDIS_URL: redis://:${SAAS_REDIS_PASSWORD}@saas-redis:6379/0
      SCORM_STORAGE_ROOT: /app/storage/scorm
      DOCUMENT_STORAGE_ROOT: /app/storage/documents
    depends_on:
      saas-postgres:
        condition: service_healthy
      saas-redis:
        condition: service_healthy
    volumes:
      - saas_scorm_storage:/app/storage/scorm
      - saas_document_storage:/app/storage/documents
    expose:
      - "3000"
    networks:
      - saas-internal
      - proxy-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  saas-frontend:
    image: ghcr.io/paulgarcia89/saas-integral-frontend:latest
    container_name: saas-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      INTERNAL_API_URL: http://saas-backend:3000/api
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    depends_on:
      saas-backend:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - saas-internal
      - proxy-net

volumes:
  saas_postgres_data:
  saas_redis_data:
  saas_scorm_storage:
  saas_document_storage:
