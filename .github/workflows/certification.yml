name: Production certification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: certification
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d certification"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/certification?schema=public
      REDIS_URL: redis://127.0.0.1:6379/0
      SCORM_ALLOW_UNSCANNED_UPLOADS: "true"
      NOTIFICATION_DELIVERY_WORKER_ENABLED: "false"
      ATS_SLA_WORKER_ENABLED: "false"
      OUTBOX_DISPATCHER_ENABLED: "false"
      MESSAGING_ENABLED: "false"
      ATS_FILE_STORAGE_DRIVER: local
      ATS_FILE_STORAGE_ROOT: /tmp/talentos-ats-e2e
      PUBLIC_FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Generar secretos efimeros para esta ejecucion
        run: |
          {
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "SCORM_SIGNING_KEY=$(openssl rand -hex 32)"
            echo "WEBHOOK_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "ATS_FILE_SIGNING_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run certify
      - name: Prepare E2E fixtures
        run: npm run seed
      - name: Run ATS lifecycle and multitenant security E2E
        run: npm run test:e2e
      - name: Verify backup format
        run: |
          BACKUP_ROOT="$RUNNER_TEMP/backups" SCORM_STORAGE_ROOT="$RUNNER_TEMP/scorm" npm run backup
          npm run restore:verify -- "$(find "$RUNNER_TEMP/backups" -mindepth 1 -maxdepth 1 -type d | head -1)"
